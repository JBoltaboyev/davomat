# ==============================================================
# UrDPI Davomat Tizimi - Nginx Konfiguratsiya Fayli
# Joylashuv: /etc/nginx/sites-available/urdpi-davomat.conf
# ==============================================================

# 1. HTTP -> HTTPS ga avtomatik yo'naltirish (SSL ulangandan so'ng)
server {
    listen 80;
    listen [::]:80;
    server_name davomat.urdpi.uz; # O'z domeningizni yoki server IP-manzilini yozing

    # Let's Encrypt bot tekshiruvi uchun
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Asosiy HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name davomat.urdpi.uz; # O'z domeningizni yozing

    # SSL Sertifikat yo'llari (Certbot orqali o'rnatiladi)
    # ssl_certificate /etc/letsencrypt/live/davomat.urdpi.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/davomat.urdpi.uz/privkey.pem;

    # Xavfsizlik protokollari
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Xavfsizlik sarlavhalari (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Fayl yuklash hajmi limiti (Excel va katta fayllar uchun)
    client_max_body_size 50M;

    # Gzip siqish (Sayt tez ochilishi uchun)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Statik fayllar (Kesh sozlamalari)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Barcha so'rovlarni Node.js (3000-port) ga uzatish
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeoutlar (katta Excel hisobotlar uchun)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
